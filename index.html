        /* STATE MANAGEMENT & THEME                                                  */

        let db = { leagues: [], teams: [], players: [] };
        let currentRoute = { page: 'classifiche', id: null };

        function initStorage() {
            const saved = localStorage.getItem('basketpedia_db_v2');
            if (saved) {
                try {
                    db = JSON.parse(saved);
                } catch(e) {
                    db = SAMPLE_DATA;
                }
            } else {
                db = SAMPLE_DATA;
                saveStorage();
            }

            // Theme setup
            if (localStorage.theme === 'light') {
                document.documentElement.classList.remove('dark');
            } else {
                document.documentElement.classList.add('dark');
            }
        }

        function saveStorage() {
            localStorage.setItem('basketpedia_db_v2', JSON.stringify(db));
        }

        function toggleTheme() {
            if (document.documentElement.classList.contains('dark')) {
                document.documentElement.classList.remove('dark');
                localStorage.theme = 'light';
            } else {
                document.documentElement.classList.add('dark');
                localStorage.theme = 'dark';
            }
            lucide.createIcons();
        }

        function resetToSampleData() {
            if (confirm("Vuoi ripristinare il database ai dati ufficiali di esempio? Tutti i dati aggiunti verranno ripristinati.")) {
                db = JSON.parse(JSON.stringify(SAMPLE_DATA));
                saveStorage();
                render();
            }
        }

        /* Backup & Restore JSON */
        function exportDatabaseJSON() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(db, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `BasketPedia_Backup_${new Date().toISOString().slice(0,10)}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        function triggerImportJSON() {
            document.getElementById('importFileInput').click();
        }

        function handleFileImport(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(evt) {
                try {
                    const imported = JSON.parse(evt.target.result);
                    if (imported.leagues && imported.teams && imported.players) {
                        db = imported;
                        saveStorage();
                        alert("Database importato con successo!");
                        render();
                    } else {
                        alert("File JSON non valido per BasketPedia.");
                    }
                } catch (err) {
                    alert("Errore nella lettura del file JSON.");
                }
            };
            reader.readAsText(file);
        }

        /* -------------------------------------------------------------------------- */
        /* IMAGE RENDERER WITH FALLBACK                                               */
        /* -------------------------------------------------------------------------- */
        function renderEntityImage(url, name, className = "w-12 h-12 rounded-xl object-cover") {
            const initials = name ? name.split(' ').map(n => n[0]).join('').substring(0, 2).toUpperCase() : 'BK';
            
            if (!url || url.trim() === '') {
                return `<div class="${className} bg-slate-200 dark:bg-slate-800 text-slate-700 dark:text-brand-400 border border-slate-300 dark:border-slate-700 font-extrabold flex items-center justify-center text-xs tracking-wider shadow-inner">${initials}</div>`;
            }

            return `
                <img src="${url}" alt="${name}" 
                     class="${className} object-cover bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 shadow-sm"
                     onerror="this.onerror=null; this.parentElement.innerHTML='<div class=\'${className} bg-slate-200 dark:bg-slate-800 text-slate-700 dark:text-brand-400 border border-slate-300 dark:border-slate-700 font-extrabold flex items-center justify-center text-xs tracking-wider\'>${initials}</div>';">
            `;
        }

        /* -------------------------------------------------------------------------- */
        /* CALCULATIONS ENGINE & PALMARÈS                                             */
        /* -------------------------------------------------------------------------- */
        function getBasePositionPoints(position) {
            const pos = parseInt(position);
            if (pos === 1) return 100;
            if (pos === 2) return 75;
            if (pos === 3) return 60;
            if (pos === 4) return 50;
            if (pos >= 5 && pos <= 8) return 30;
            return 10;
        }

        function calculateSeasonPoints(historyItem) {
            const league = db.leagues.find(l => l.id === historyItem.leagueId);
            const weight = league ? (league.weight || 1.0) : 1.0;
            const base = getBasePositionPoints(historyItem.position);
            return Math.round(base * weight);
        }

        /* Returns Palmarès summary for Team */
        function getTeamPalmares(teamId) {
            const team = db.teams.find(t => t.id === teamId);
            if (!team || !team.history) return [];

            const trophies = {};
            team.history.forEach(h => {
                if (parseInt(h.position) === 1) {
                    const league = db.leagues.find(l => l.id === h.leagueId);
                    const lName = league ? league.name : 'Campionato';
                    trophies[lName] = (trophies[lName] || 0) + 1;
                }
            });

            return Object.entries(trophies).map(([leagueName, count]) => `${count}x ${leagueName}`);
        }

        function getTeamStats(teamId) {
            const team = db.teams.find(t => t.id === teamId);
            if (!team) return { totalPoints: 0, titles: 0, seasons: 0, trophies: [] };

            let totalPoints = 0;
            let titles = 0;
            const trophies = getTeamPalmares(teamId);

            (team.history || []).forEach(h => {
                totalPoints += calculateSeasonPoints(h);
                if (parseInt(h.position) === 1) titles++;
            });

            return {
                totalPoints,
                titles,
                seasons: team.history ? team.history.length : 0,
                trophies
            };
        }

        /* Returns Palmarès summary for Player based on teams played in */
        function getPlayerStats(playerId) {
            const player = db.players.find(p => p.id === playerId);
            if (!player) return { totalPoints: 0, titles: 0, clubs: 0, trophies: [], avgPts: 0 };

            let totalPoints = 0;
            let titles = 0;
            let totalScoredPts = 0;
            let totalSeasonsTracked = 0;
            const uniqueClubs = new Set();
            const playerTrophies = {};

            (player.history || []).forEach(ph => {
                uniqueClubs.add(ph.teamId);
                if (ph.pts) {
                    totalScoredPts += parseFloat(ph.pts);
                    totalSeasonsTracked++;
                }

                const team = db.teams.find(t => t.id === ph.teamId);
                if (team && team.history) {
                    const seasonHist = team.history.find(th => th.season === ph.season);
                    if (seasonHist) {
                        totalPoints += calculateSeasonPoints(seasonHist);
                        if (parseInt(seasonHist.position) === 1) {
                            titles++;
                            const league = db.leagues.find(l => l.id === seasonHist.leagueId);
                            const lName = league ? league.name : 'Titolo';
                            playerTrophies[lName] = (playerTrophies[lName] || 0) + 1;
                        }
                    }
                }
            });

            const trophies = Object.entries(playerTrophies).map(([lName, count]) => `${count}x ${lName}`);

            return {
                totalPoints,
                titles,
                clubs: uniqueClubs.size,
                trophies,
                avgPts: totalSeasonsTracked > 0 ? (totalScoredPts / totalSeasonsTracked).toFixed(1) : 'N/A'
            };
        }

        /* Helper to get team name at a specific season (including sponsorships) */
        function getTeamNameForSeason(team, season) {
            if (!team) return 'N/A';
            if (!team.previousNames || team.previousNames.length === 0) return team.name;

            const yearStr = season.split('-')[0];
            const year = parseInt(yearStr.length === 2 ? '20' + yearStr : yearStr);

            for (const pn of team.previousNames) {
                const parts = pn.period.split('-');
                const start = parseInt(parts[0]);
                const end = parts[1] === 'Presente' ? 2099 : parseInt(parts[1]);
                if (year >= start && year <= end) {
                    return pn.name;
                }
            }
            return team.name;
        }

                                ${list.map(item => `<option value="${item.id}" ${compareState.entity1 === item.id ? 'selected' : ''}>${item.name}</option>`).join('')}

                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-400 uppercase mb-2">Seleziona Secondo Entità</label>

                            </select>
                        </div>
                    </div>

                    ${e1 && e2 ? renderComparisonResult(e1, e2, compareState.type) : '<p class="text-center text-slate-400 py-12 text-sm">Seleziona due elementi per avviare il confronto diretto.</p>'}

        function setCompareType(type) {
            compareState = { entity1: '', entity2: '', type };
            render();
        }

        function renderComparisonResult(e1, e2, type) {
            if (type === 'players') {
                const s1 = getPlayerStats(e1.id);
                const s2 = getPlayerStats(e2.id);

                return `
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                        ${renderPlayerCardCompare(e1, s1)}
                        ${renderPlayerCardCompare(e2, s2)}
                    </div>
                `;
            } else {
                const s1 = getTeamStats(e1.id);
                const s2 = getTeamStats(e2.id);

                return `
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                        ${renderTeamCardCompare(e1, s1)}
                        ${renderTeamCardCompare(e2, s2)}
                    </div>
                `;
            }
        }

                <input type="text" placeholder="2022-23" class="ph-season w-1/5 bg-slate-100 dark:bg-slate-950 border border-slate-300 dark:border-slate-700 rounded-xl px-2 py-1 text-xs text-slate-900 dark:text-white">
                <select class="ph-team w-2/5 bg-slate-100 dark:bg-slate-950 border border-slate-300 dark:border-slate-700 rounded-xl px-2 py-1 text-xs text-slate-900 dark:text-white">
                    ${db.teams.map(t => `<option value="${t.id}">${t.name}</option>`).join('')}
                </select>
                <input type="number" step="0.1" placeholder="PTS" class="ph-pts w-1/5 bg-slate-100 dark:bg-slate-950 border border-slate-300 dark:border-slate-700 rounded-xl px-2 py-1 text-xs text-slate-900 dark:text-white">
                <input type="text" placeholder="Ruolo" class="ph-role w-1/5 bg-slate-100 dark:bg-slate-950 border border-slate-300 dark:border-slate-700 rounded-xl px-2 py-1 text-xs text-slate-900 dark:text-white">
            `;
            container.appendChild(div);
        }

        function saveEntityForm() {
            const isEdit = !!activeEditing.id;

            if (activeEditing.type === 'league') {
                const name = document.getElementById('leagueName').value.trim();
                if (!name) return alert('Inserisci il nome del campionato.');

                const newLeague = {
                    id: isEdit ? activeEditing.id : 'league-' + Date.now(),
                    name,
                    logo: document.getElementById('leagueLogo').value.trim(),
                    country: document.getElementById('leagueCountry').value.trim() || '🇮🇹 Italia',
                    tier: document.getElementById('leagueTier').value.trim() || 'Nazionale',
                    weight: parseFloat(document.getElementById('leagueWeight').value) || 1.0,
                    description: document.getElementById('leagueDescription').value.trim()
                };

                if (isEdit) {
                    const idx = db.leagues.findIndex(l => l.id === activeEditing.id);
                    if (idx !== -1) db.leagues[idx] = newLeague;
                } else {
                    db.leagues.push(newLeague);
                }

            } else if (activeEditing.type === 'team') {
                const name = document.getElementById('teamName').value.trim();
                if (!name) return alert('Inserisci il nome della squadra.');

                const pnPeriods = document.querySelectorAll('.pn-period');
                const pnNames = document.querySelectorAll('.pn-name');
                const previousNames = [];
                pnPeriods.forEach((el, i) => {
                    if (el.value.trim() && pnNames[i].value.trim()) {
                        previousNames.push({ period: el.value.trim(), name: pnNames[i].value.trim() });
                    }
                });

                const thSeasons = document.querySelectorAll('.th-season');
                const thLeagues = document.querySelectorAll('.th-league');
                const thPositions = document.querySelectorAll('.th-pos');
                const history = [];
                thSeasons.forEach((el, i) => {
                    if (el.value.trim() && thPositions[i].value) {
                        history.push({
                            season: el.value.trim(),
                            leagueId: thLeagues[i].value,
                            position: parseInt(thPositions[i].value)
                        });
                    }
                });

                const newTeam = {
                    id: isEdit ? activeEditing.id : 'team-' + Date.now(),
                    name,
                    logo: document.getElementById('teamLogo').value.trim(),
                    country: document.getElementById('teamCountry').value.trim() || '🇮🇹 Italia',
                    founded: parseInt(document.getElementById('teamFounded').value) || null,
                    previousNames,
                    history
                };

                if (isEdit) {
                    const idx = db.teams.findIndex(t => t.id === activeEditing.id);
                    if (idx !== -1) db.teams[idx] = newTeam;
                } else {
                    db.teams.push(newTeam);
                }

            } else if (activeEditing.type === 'player') {
                const name = document.getElementById('playerName').value.trim();
                if (!name) return alert('Inserisci il nome del giocatore.');

                const phSeasons = document.querySelectorAll('.ph-season');
                const phTeams = document.querySelectorAll('.ph-team');
                const phPts = document.querySelectorAll('.ph-pts');
                const phRoles = document.querySelectorAll('.ph-role');
                const history = [];
                phSeasons.forEach((el, i) => {
                    if (el.value.trim() && phTeams[i].value) {
                        history.push({
                            season: el.value.trim(),
                            teamId: phTeams[i].value,
                            pts: phPts[i].value ? parseFloat(phPts[i].value) : null,
                            role: phRoles[i].value.trim() || 'Giocatore'
                        });
                    }
                });

                const newPlayer = {
                    id: isEdit ? activeEditing.id : 'player-' + Date.now(),
                    name,
                    photo: document.getElementById('playerPhoto').value.trim(),
                    country: document.getElementById('playerCountry').value.trim() || '🇮🇹 Italia',
                    position: document.getElementById('playerPosition').value,
                    birthYear: parseInt(document.getElementById('playerBirthYear').value) || null,
                    height: parseInt(document.getElementById('playerHeight').value) || null,
                    jerseyNumber: parseInt(document.getElementById('playerJersey').value) || null,
                    history
                };

                if (isEdit) {
                    const idx = db.players.findIndex(p => p.id === activeEditing.id);
                    if (idx !== -1) db.players[idx] = newPlayer;
                } else {
                    db.players.push(newPlayer);
                }
            }

            saveStorage();
            closeModal();
            render();
        }

        function deleteCurrentEntity() {
            if (!activeEditing.id) return;
            if (confirm("Sei sicuro di voler eliminare questo elemento dal database?")) {
                if (activeEditing.type === 'league') {
                    db.leagues = db.leagues.filter(l => l.id !== activeEditing.id);
                } else if (activeEditing.type === 'team') {
                    db.teams = db.teams.filter(t => t.id !== activeEditing.id);
                } else if (activeEditing.type === 'player') {
                    db.players = db.players.filter(p => p.id !== activeEditing.id);
                }
                saveStorage();
                closeModal();
                navigateTo('classifiche');
            }
        }

        window.onload = function() {
            initStorage();
            render();
        };
    </script>
</body>
</html>
